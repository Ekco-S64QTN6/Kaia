name: Security regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KAIA_CAPABILITY_TOKEN_SECRET: ci-only-secret-never-used-outside-tests
      PYTHONPATH: .:core
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Validate shell-script syntax
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do bash -n "$script"; done

      - name: Compile all Python modules
        run: python -m compileall -q core security scripts tests

      - name: Run security regression suite
        run: bash scripts/run_ci_tests.sh
