name: Security regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KAIA_CAPABILITY_TOKEN_SECRET: ci-only-secret-never-used-outside-tests
      PYTHONPATH: .:core
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Compile all Python modules
        run: python -m compileall -q core security scripts tests

      - name: Run security, policy, firewall-ledger, and dashboard regression tests
        shell: bash
        run: |
          set -euo pipefail

          tests=(
            tests/test_config_system_state_paths.py
            tests/test_diagnostics_read_only.py
            tests/test_host_executor_absolute_paths.py
            tests/test_host_executor_path_containment.py
            tests/test_install_services_security.py
            tests/test_lockdown_failure_reporting.py
            tests/test_lockdown_script_guards.py
            tests/test_mitigation_idempotent.py
            tests/test_network_discovery_resource_bounds.py
            tests/test_negative_security.py
            tests/test_policy_gate_ipc.py
            tests/test_policy_gate_lockdown.py
            tests/test_restore_blocks_ledger.py
            tests/test_tamper_baseline_fail_closed.py
            tests/test_ui_visual_widgets.py
            tests/test_web_bridge.py
            tests/test_web_bridge_guards.py
            tests/test_tier5_security.py::test_rule_compilation
          )

          # These tests arrive with focused feature PRs. Include them when the
          # PR under test contains the files; don't fail main simply because a
          # separate feature PR has not merged yet.
          for optional_test in \
            tests/test_host_executor_unmitigation.py \
            tests/test_fim_event_descriptor.py; do
            if [[ -f "$optional_test" ]]; then
              tests+=("$optional_test")
            fi
          done

          # The hardened YARA path is exercised with a mocked transient-service
          # runner, never by relying on a systemd daemon inside the hosted runner.
          if grep -q "def fake_sandbox" tests/test_tier5_security.py; then
            tests+=(
              tests/test_tier5_security.py::test_yara_rule_validation
              tests/test_tier5_security.py::test_yara_validation_fails_closed_when_sandbox_runner_is_missing
              tests/test_tier5_security.py::test_rule_engine_rejects_path_traversal_and_duplicate_names
              tests/test_tier5_security.py::test_rule_engine_refuses_to_store_rule_without_python_yara
            )
          fi

          pytest -q "${tests[@]}"
