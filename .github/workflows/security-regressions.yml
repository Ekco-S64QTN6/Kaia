name: Security regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KAIA_CAPABILITY_TOKEN_SECRET: ci-only-secret-never-used-outside-tests
      PYTHONPATH: .:core
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Validate shell-script syntax
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do bash -n "$script"; done

      - name: Compile all Python modules
        run: python -m compileall -q core security scripts tests

      - name: Run security regression suite
        run: bash scripts/run_ci_tests.sh
