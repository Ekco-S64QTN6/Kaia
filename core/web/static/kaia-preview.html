<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaia Sentinel Avatar Preview</title>
  <link rel="stylesheet" href="/static/css/kaia-preview.css">
</head>
<body>
  <h1>KAIA // CODEC PREVIEW</h1>
  <div class="codec" id="stage">
  </div>
  <div class="controls" id="moods"><div class="row-label">MOOD</div></div>
  <div class="controls">
    <div class="row-label">EVENTS</div>
    <button data-react="capture">Handshake capture</button>
    <button data-react="discovery">New AP</button>
    <button data-react="alert">Alert</button>
    <button id="cycle">Auto-cycle moods</button>
    <button id="link">Toggle link loss</button>
  </div>
  <div class="controls">
    <div class="row-label">SPEECH</div>
    <input id="line" value="Handshake captured. Passive capture logged.">
    <button id="say">Speak</button>
  </div>

  <script src="/static/js/kaia/kaia-shaders.js"></script>
  <script src="/static/js/kaia/kaia-renderer.js"></script>
  <script src="/static/js/kaia/kaia-animator.js"></script>
  <script src="/static/js/kaia/kaia-codec.js"></script>
  <script src="/static/js/kaia/kaia-sentinel-states.js"></script>
  <script src="/static/js/kaia/kaia-preview.js"></script>
</body>
</html>
